<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>本地演示业务系统</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; display: flex; height: 100vh; }
  #sidebar { width: 220px; background: #1f2937; color: #fff; padding: 12px 0; }
  #sidebar h3 { padding: 0 16px; color: #9ca3af; font-size: 13px; }
  #sidebar a { display: block; padding: 10px 16px; color: #d1d5db; text-decoration: none; cursor: pointer; }
  #sidebar a:hover, #sidebar a.active { background: #374151; color: #fff; }
  #main { flex: 1; padding: 24px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; }
  button { padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  .dialog { border: 1px solid #9ca3af; padding: 16px; margin-top: 12px; background: #f9fafb; }
  .field { margin-bottom: 8px; }
  .field label { display: inline-block; width: 90px; }
  input[type=text], select { padding: 4px; width: 220px; }
</style>
</head>
<body>
<nav id="sidebar">
  <h3>系统管理</h3>
  <a href="#/system/user" data-route="user">用户管理</a>
  <a href="#/system/role" data-route="role">角色管理</a>
  <a href="#/system/menu" data-route="menu">菜单管理</a>
  <h3>业务管理</h3>
  <a href="#/biz/order" data-route="order">订单管理</a>
  <a href="#/biz/product" data-route="product">商品管理</a>
</nav>
<main id="main">
  <h1 id="page-title">用户管理</h1>
  <div id="page-content"></div>
</main>
<script>
  const pages = {
    user: {
      title: "用户管理",
      render: () => `
        <div class="toolbar">
          <button data-action="query">查询</button>
          <button data-action="reset">重置</button>
          <button data-action="create">新增用户</button>
          <button data-action="export">导出</button>
        </div>
        <div class="dialog" id="query-dialog">
          <div class="field"><label>用户名</label><input type="text" name="username" placeholder="请输入用户名" /></div>
          <div class="field"><label>手机号</label><input type="text" name="phone" placeholder="请输入手机号" maxlength="11" /></div>
          <div class="field"><label>状态</label><select name="status"><option value="">全部</option><option value="1">启用</option><option value="0">停用</option></select></div>
          <button data-action="do-query">确定查询</button>
          <button data-action="do-reset">清空条件</button>
        </div>
        <table>
          <thead><tr><th>用户名</th><th>手机号</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>admin</td><td>13800000000</td><td>启用</td><td><button data-action="edit" data-id="1">编辑</button><button data-action="delete" data-id="1">删除</button><button data-action="detail" data-id="1">详情</button></td></tr>
            <tr><td>zhangsan</td><td>13900000000</td><td>启用</td><td><button data-action="edit" data-id="2">编辑</button><button data-action="delete" data-id="2">删除</button><button data-action="detail" data-id="2">详情</button></td></tr>
            <tr><td>lisi</td><td>13700000000</td><td>停用</td><td><button data-action="edit" data-id="3">编辑</button><button data-action="delete" data-id="3">删除</button><button data-action="detail" data-id="3">详情</button></td></tr>
          </tbody>
        </table>
        <div id="create-dialog" class="dialog" style="display:none">
          <div class="field"><label>用户名</label><input type="text" name="username" required maxlength="20" /></div>
          <div class="field"><label>手机号</label><input type="text" name="phone" maxlength="11" /></div>
          <div class="field"><label>角色</label><select name="role"><option>管理员</option><option>操作员</option><option>访客</option></select></div>
          <button data-action="save">保存</button>
          <button data-action="cancel">取消</button>
        </div>
      `,
    },
    role: {
      title: "角色管理",
      render: () => `
        <div class="toolbar">
          <button data-action="query">查询</button>
          <button data-action="create">新增角色</button>
          <button data-action="export">导出</button>
        </div>
        <table>
          <thead><tr><th>角色名称</th><th>编码</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>管理员</td><td>admin</td><td>启用</td><td><button data-action="edit" data-id="1">编辑</button><button data-action="delete" data-id="1">删除</button></td></tr>
            <tr><td>操作员</td><td>operator</td><td>启用</td><td><button data-action="edit" data-id="2">编辑</button><button data-action="delete" data-id="2">删除</button></td></tr>
          </tbody>
        </table>
        <div id="create-dialog" class="dialog" style="display:none">
          <div class="field"><label>角色名称</label><input type="text" name="roleName" required maxlength="30" /></div>
          <div class="field"><label>角色编码</label><input type="text" name="roleCode" required /></div>
          <button data-action="save">保存</button>
          <button data-action="cancel">取消</button>
        </div>
      `,
    },
    menu: {
      title: "菜单管理",
      render: () => `
        <div class="toolbar">
          <button data-action="query">查询</button>
          <button data-action="create">新增菜单</button>
        </div>
        <table>
          <thead><tr><th>菜单名称</th><th>路由</th><th>排序</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>用户管理</td><td>/system/user</td><td>1</td><td><button data-action="edit" data-id="1">编辑</button><button data-action="delete" data-id="1">删除</button></td></tr>
          </tbody>
        </table>
        <div id="create-dialog" class="dialog" style="display:none">
          <div class="field"><label>菜单名称</label><input type="text" name="menuName" required /></div>
          <button data-action="save">保存</button>
          <button data-action="cancel">取消</button>
        </div>
      `,
    },
    order: {
      title: "订单管理",
      render: () => `
        <div class="toolbar">
          <button data-action="query">查询</button>
          <button data-action="export">导出</button>
          <button data-action="import">导入</button>
        </div>
        <table>
          <thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>SO20260801</td><td>客户A</td><td>100.00</td><td>已支付</td><td><button data-action="detail" data-id="1">详情</button></td></tr>
          </tbody>
        </table>
      `,
    },
    product: {
      title: "商品管理",
      render: () => `
        <div class="toolbar">
          <button data-action="query">查询</button>
          <button data-action="create">新增商品</button>
          <button data-action="export">导出</button>
        </div>
        <table>
          <thead><tr><th>商品名称</th><th>价格</th><th>库存</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>商品A</td><td>10.00</td><td>100</td><td><button data-action="edit" data-id="1">编辑</button><button data-action="delete" data-id="1">删除</button></td></tr>
          </tbody>
        </table>
      `,
    },
  };
  function currentRoute() {
    const h = location.hash.replace(/^#/, "") || "/system/user";
    return h.split("/")[2] || "user";
  }
  function render() {
    const key = currentRoute();
    const page = pages[key] || pages.user;
    document.getElementById("page-title").textContent = page.title;
    document.getElementById("page-content").innerHTML = page.render();
    document.querySelectorAll("#sidebar a").forEach((a) => a.classList.toggle("active", a.dataset.route === key));
    document.querySelectorAll("[data-action=create]").forEach((b) => b.addEventListener("click", () => {
      const d = document.getElementById("create-dialog");
      if (d) d.style.display = "block";
    }));
    document.querySelectorAll("[data-action=cancel]").forEach((b) => b.addEventListener("click", () => {
      const d = document.getElementById("create-dialog");
      if (d) d.style.display = "none";
    }));
    document.querySelectorAll("[data-action=detail]").forEach((b) => b.addEventListener("click", () => {
      const d = document.createElement("div");
      d.id = "detail-dialog";
      d.className = "dialog";
      d.innerHTML = '<div class="field"><label>用户名</label><span>admin</span></div><div class="field"><label>手机号</label><span>13800000000</span></div><button data-action="close-detail">关闭</button>';
      document.getElementById("main").appendChild(d);
      d.querySelector("[data-action=close-detail]").addEventListener("click", () => d.remove());
    }));
  }
  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
